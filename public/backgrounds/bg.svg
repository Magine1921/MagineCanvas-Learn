    <filter id="contour" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <pattern id="topography" width="190" height="150" patternUnits="userSpaceOnUse">
      <path d="M-25 38C20 5 80 7 126 33s89 29 121-3M-30 68C19 31 77 36 122 59s89 26 128-11M-28 102C25 65 78 70 119 90s83 31 133-7M-20 132C32 100 79 104 124 124s83 25 123-2" fill="none" stroke="#7d91a7" stroke-opacity="0.12" stroke-width="1.2"/>
