  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <ellipse cx="430" cy="390" rx="430" ry="310" fill="url(#blue)" filter="url(#soft)"/>
  <ellipse cx="1100" cy="595" rx="460" ry="350" fill="url(#orange)" filter="url(#soft)"/>
  <ellipse cx="1315" cy="195" rx="310" ry="220" fill="url(#blue)" opacity="0.55" filter="url(#soft)"/>
  <g filter="url(#contour)">
