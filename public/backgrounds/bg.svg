    <path d="M-30 630C210 430 335 770 560 573S925 395 1108 535s320 49 530-160" fill="none" stroke="#111c28" stroke-opacity="0.74" stroke-width="2"/>
    <path d="M-45 681C206 473 339 819 575 614S929 441 1120 579s323 43 540-165" fill="none" stroke="#111c28" stroke-opacity="0.65" stroke-width="1.7"/>
