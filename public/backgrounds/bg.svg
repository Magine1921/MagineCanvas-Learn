<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Magine Canvas abstract background">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060a"/>
      <stop offset="0.48" stop-color="#07111e"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1677bf" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="#0d4c87" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#06101c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ee743a" stop-opacity="0.88"/>
      <stop offset="0.42" stop-color="#a83e20" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#240c08" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
