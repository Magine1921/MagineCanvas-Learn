<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MagineCanvas</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f4f4f5;
        background: #090b0e;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        user-select: none;
      }
      .shell {
        width: 100%;
        height: 100%;
        padding: 34px 38px 30px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(12, 14, 18, 0.96);
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand img { width: 42px; height: 42px; object-fit: contain; }
      .name { font-size: 20px; font-weight: 650; }
      .edition { margin-top: 3px; color: #8f949e; font-size: 12px; }
      .status { margin-bottom: 13px; color: #d6d8dc; font-size: 13px; }
      .track { height: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.1); }
      .bar {
        width: 8%;
        height: 100%;
        background: #f4b35f;
        transition: width 360ms cubic-bezier(.22,.8,.25,1);
        box-shadow: 0 0 16px rgba(244, 179, 95, 0.45);
      }
      .detail { min-height: 17px; margin-top: 10px; color: #747985; font-size: 11px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">
        <img src="__MAGINE_SPLASH_ICON__" alt="" />
        <div>
          <div class="name">MagineCanvas</div>
          <div id="edition" class="edition">学习源码版</div>
        </div>
      </div>
      <div>
        <div id="status" class="status" aria-live="polite">正在初始化客户端...</div>
        <div
          id="track"
          class="track"
          role="progressbar"
          aria-label="客户端启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
        ><div id="bar" class="bar"></div></div>
        <div id="detail" class="detail">首次启动或版本更新后可能需要更长时间</div>
      </div>
    </main>
    <script>
      window.setStartupState = function setStartupState(state) {
        if (!state || typeof state !== 'object') return;
        if (state.status) document.getElementById('status').textContent = state.status;
        if (typeof state.detail === 'string') document.getElementById('detail').textContent = state.detail;
        if (state.edition) document.getElementById('edition').textContent = state.edition;
        if (Number.isFinite(state.progress)) {
          const value = Math.max(4, Math.min(100, Number(state.progress)));
          document.getElementById('bar').style.width = value + '%';
          document.getElementById('track').setAttribute('aria-valuenow', String(Math.round(value)));
        }
      };
    </script>
  </body>
</html>
